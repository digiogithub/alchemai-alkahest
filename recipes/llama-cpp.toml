# Engine recipe: mainline llama.cpp (ALK-SP-0003.R3/R4/R6; ALK-US-0026, ALK-US-0049, ALK-US-0050).
#
# Pinned to one upstream release tag (b11669). Every sha256 is the digest GitHub reports for the
# release asset (`digest` field of the releases API). Moving the pin means editing this file,
# re-checking the digests and running the install tests with ALKAHEST_TEST_NET=1 and
# ALKAHEST_TEST_GPU=1.
#
# Variants and their runtime requirements:
#   cpu        runtime-selected SIMD backends; runs everywhere.
#   cuda12.8   Linux x64. Needs an NVIDIA driver for CUDA 12.8+ and the CUDA 12 runtime libraries
#              (libcudart, libcublas) installed system-wide; the upstream `cudart-llama-*` archive
#              (440-590 MB) bundles them and is not installed by this recipe.
#   cuda13.4   Linux x64/arm64, Windows x64. Needs a driver for CUDA 13.4+ (same runtime note).
#   cuda12.4   Windows x64. Needs a driver for CUDA 12.4+; the CUDA DLLs come from the separate
#              `cudart-llama-bin-win-cuda-12.4-x64.zip` (391 MB) or a CUDA toolkit on PATH.
#   vulkan     any Vulkan 1.x GPU through the system loader.
#   rocm       AMD ROCm/HIP 10.0 (Linux x64, Windows x64).
#   metal      macOS Apple Silicon: the standard macOS arm64 archive has Metal compiled in.
#   sycl       Intel oneAPI; installed on request only, never picked automatically.
#
# Every variant also carries `source` build steps (`engines install --from-source`).

id = "llama-cpp"
version = "b11669"
description = "llama.cpp (mainline)"
license = "MIT"
homepage = "https://github.com/ggml-org/llama.cpp"
# Path of the server binary inside the extracted tree (".exe" is added on Windows).
executable = "llama-server"


