# Engine recipe: mainline llama.cpp (ALK-SP-0003.R3, R6; ALK-US-0026, ALK-US-0049).
#
# Pinned to one upstream release tag. The sha256 values are the digests GitHub reports for the
# release assets. Moving the pin means editing this file, re-checking the digests and running
# the install test with ALKAHEST_TEST_NET=1.

id = "llama-cpp"
version = "b11669"
description = "llama.cpp (mainline)"
license = "MIT"
homepage = "https://github.com/ggml-org/llama.cpp"
# Path of the server binary inside the extracted tree (".exe" is added on Windows).
executable = "llama-server"

[variants.cpu]
accelerator = "cpu"


# Unix release archives hold one top-level directory (`llama-b11669/`), which is stripped.
# The Windows archives are flat.
