# Engine recipe: mainline llama.cpp, CPU-only prebuilt (ALK-SP-0003.R6, ALK-US-0026).
#
# Pinned to one upstream release tag. The sha256 values are the digests GitHub reports for the
# release assets; the linux-x64 and windows-x64 ones were also checked against a manual
# download. Moving the pin means editing this file, re-checking the digests and running the
# install test with ALKAHEST_TEST_NET=1.
#
# The data model is shared with the full recipe system (ALK-US-0049): `kind` will gain
# `source` (build from source per accelerator); `variant` names the accelerator build.

id = "llama-cpp"
variant = "cpu"
kind = "prebuilt"
description = "llama.cpp (mainline), CPU-only build with runtime-selected SIMD backends"
license = "MIT"
homepage = "https://github.com/ggml-org/llama.cpp"
tag = "b11669"
# Path of the server binary inside the extracted tree (".exe" is added on Windows).
executable = "llama-server"

# Unix release archives hold one top-level directory (`llama-b11669/`), which is stripped.
# The Windows archives are flat.
