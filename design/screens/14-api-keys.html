<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alkahest · API keys and network</title>
<script src="./support.js"></script>
</head>
<body>
<script type="text/x-dc-template">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1214}
a{color:#C9CDD1;text-decoration:none}a:hover{color:#E8E6E1}
</style>
</helmet>
<div style="min-height: 100vh; background: #0F1214; color: #E8E6E1; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="Main" style="flex: 1 0 232px; box-sizing: border-box; padding: 18px 14px; background: #121518; border-right: 1px solid #2A3036; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 10px 20px">
      <svg viewBox="0 0 64 64" width="26" height="26" fill="none" stroke="#E3A63B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 12 H58"></path><path d="M13 12 L32 52 L51 12"></path><circle cx="32" cy="27" r="7" fill="#E3A63B" stroke="none"></circle></svg>
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.04em">alkahest</span>
    </div>
    <a href="10-library.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l8-3 8 3-8 3z"></path><path d="M4 12l8 3 8-3"></path><path d="M4 18l8 3 8-3"></path></svg>Library<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px">14</span></a>
    <a href="11-discover.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Discover<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9CC4F0">2↓</span></a>
    <a href="13-running.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>Running<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6FD3BF"><span style="width: 7px; height: 7px; border-radius: 50%; background: #46B5A0"></span>4</span></a>
    <a href="15-engines.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Engines</a>
    <a href="14-api-keys.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; background: #2B2414; color: #F2C46E; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l9-9M17 6l3 3M14 9l2 2"></path></svg>API keys</a>
    <a href="16-settings.html" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Settings</a>
    <div style="margin-top: auto; padding: 14px; border: 1px solid #2A3036; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A7ADB3">
      <span style="display: flex; align-items: center; gap: 8px; color: #6FD3BF; font-weight: 600; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #46B5A0"></span>Service running</span>
      <span style="font-family: 'IBM Plex Mono', monospace">0.0.0.0:11435</span>
      <span>systemd · alkahest.service</span>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; gap: 18px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px; margin-right: auto">
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">API keys &amp; network</h1>
        <span style="font-size: 13px; color: #A7ADB3">localhost never needs a key. Every other client does.</span>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 8px; border: none; background: #E3A63B; color: #1A1206; font: 600 14px 'Schibsted Grotesk', sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New key</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
      <div style="flex: 1.6 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

        <section style="background: #161A1D; border: 1px solid #2A3036; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">Allow access from other machines</h2>
              <span style="font-size: 13px; color: #A7ADB3">Binds the API on all interfaces. Requests without a valid key get 401.</span>
            </div>
            <label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 14px">
              <input type="checkbox" checked="{{external}}" aria-label="Allow external access" style="accent-color: #46B5A0; width: 18px; height: 18px; margin: 0">{{externalLabel}}
            </label>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7ADB3">Bind address
              <input type="text" value="{{bind}}" style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #343B42; background: #121518; color: #E8E6E1; font: 500 14px 'IBM Plex Mono', monospace">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7ADB3">Port
              <input type="text" value="11435" style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #343B42; background: #121518; color: #E8E6E1; font: 500 14px 'IBM Plex Mono', monospace">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A7ADB3">Allowed origins (CORS)
              <input type="text" value="https://n8n.lan" style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #343B42; background: #121518; color: #E8E6E1; font: 500 14px 'IBM Plex Mono', monospace">
            </label>
          </div>
          <sc-if value="{{external}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: #2B2414; color: #F2C46E; font-size: 13px; line-height: 1.45">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
              <span>Traffic is plain HTTP. Put Alkahest behind a TLS reverse proxy before exposing it outside a trusted network.</span>
            </div>
          </sc-if>
        </section>

        <section style="background: #161A1D; border: 1px solid #2A3036; border-radius: 14px; overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #2A3036"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Keys</h2><span style="font-size: 12px; color: #A7ADB3">stored hashed · shown once at creation</span></div>
          <div style="overflow-x: auto">
            <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 13px">
              <thead><tr style="text-align: left; color: #A7ADB3; font-size: 12px"><th style="padding: 10px 20px; font-weight: 600">Name</th><th style="padding: 10px 8px; font-weight: 600">Key</th><th style="padding: 10px 8px; font-weight: 600">Scope</th><th style="padding: 10px 8px; font-weight: 600">Last used</th><th style="padding: 10px 8px; font-weight: 600; text-align: right">24 h</th><th style="padding: 10px 20px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
              <tbody>
                <sc-for list="{{keys}}" as="k" hint-placeholder-count="4">
                  <tr style="border-top: 1px solid #22272C">
                    <td style="padding: 12px 20px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px">{{k.name}}</span><span style="font-size: 12px; color: #A7ADB3">created {{k.created}}</span></div></td>
                    <td style="padding: 12px 8px; font-family: 'IBM Plex Mono', monospace; color: #C9CDD1">{{k.prefix}}</td>
                    <td style="padding: 12px 8px"><div style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{k.scopes}}" as="s" hint-placeholder-count="2"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid #343B42; color: #C9CDD1">{{s}}</span></sc-for></div></td>
                    <td style="padding: 12px 8px; color: {{k.usedFg}}">{{k.used}}</td>
                    <td style="padding: 12px 8px; text-align: right; font-family: 'IBM Plex Mono', monospace">{{k.count}}</td>
                    <td style="padding: 12px 20px; text-align: right"><button type="button" style="height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid #6A2E25; background: transparent; color: #F08A75; font: 600 12px 'Schibsted Grotesk', sans-serif">Revoke</button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <section style="background: #1D2226; border: 1px solid #343B42; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
          <div style="display: flex; align-items: center; gap: 8px; color: #6FD3BF; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #46B5A0"></span>Key created · home-assistant</div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: #0B0D0F; border: 1px solid #E3A63B">
            <code style="flex: 1; min-width: 0; font: 500 13px 'IBM Plex Mono', monospace; color: #F2C46E; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ak_live_[GENERATED-KEY-SHOWN-ONCE]</code>
            <button type="button" aria-label="Copy key" style="width: 32px; height: 32px; border-radius: 7px; border: 1px solid #343B42; background: #1D2226; color: #E8E6E1; display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
          </div>
          <span style="font-size: 12px; color: #A7ADB3; line-height: 1.5">Copy it now. Alkahest keeps only a hash and cannot show this key again.</span>
          <button type="button" style="align-self: flex-end; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #343B42; background: #161A1D; color: #E8E6E1; font: 500 13px 'Schibsted Grotesk', sans-serif">Done</button>
        </section>

        <section style="background: #161A1D; border: 1px solid #2A3036; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600">Endpoints</h2>
          <sc-for list="{{endpoints}}" as="e" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #22272C">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{e.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A7ADB3">{{e.path}}</span></span>
              <input type="checkbox" checked="{{ true }}" aria-label="Enable {{e.name}}" style="accent-color: #46B5A0; width: 18px; height: 18px; margin: 0">
            </div>
          </sc-for>
          <code style="font: 400 12px/1.6 'IBM Plex Mono', monospace; color: #C9CDD1; word-break: break-all">curl http://alkahest.lan:11435/v1/models -H "Authorization: Bearer $ALKAHEST_KEY"</code>
        </section>

        <section style="background: #161A1D; border: 1px solid #2A3036; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 14px; font-weight: 600">Hugging Face token</span><span style="font-size: 12px; color: #A7ADB3">in system keyring · used for gated repos and faster pulls</span></span>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid #343B42; background: #1D2226; color: #E8E6E1; font: 500 13px 'Schibsted Grotesk', sans-serif">Replace</button>
        </section>
      </aside>
    </div>
  </main>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"external":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const external = this.props.external ?? true;
    const k = (name, prefix, scopes, created, used, count, recent) => ({ name, prefix, scopes, created, used, count, usedFg: recent ? '#6FD3BF' : '#A7ADB3' });
    return {
      external,
      externalLabel: external ? 'On' : 'Off',
      bind: external ? '0.0.0.0' : '127.0.0.1',
      keys: [
        k('n8n workflows', 'ak_live_…7f3c', ['chat', 'embed', 'all models'], '2 Oct', 'now', '3 412', true),
        k('ci decisions', 'ak_live_…a91e', ['decisions', 'qwen3:4b-decision'], '9 Oct', '6 s ago', '18 044', true),
        k('laptop · Zed', 'ak_live_…02bd', ['chat', 'anthropic'], '28 Sep', '2 h ago', '211', false),
        k('home-assistant', 'ak_live_…c55a', ['audio', 'whisper-large-v3-turbo'], 'today', 'never', '0', false)
      ],
      endpoints: [
        { name: 'Ollama native', path: '/api/*' },
        { name: 'OpenAI compatible', path: '/v1/chat/completions · /v1/embeddings · …' },
        { name: 'Anthropic Messages', path: '/v1/messages' },
        { name: 'Decisions', path: '/v1/systemone · /v1/decisions' }
      ]
    };
  }
}
</script>
</body>
</html>
