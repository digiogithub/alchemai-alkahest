[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Digio"]
# Placeholder until the public repository exists.
repository = "https://github.com/digiogithub/alkahest"
rust-version = "1.98"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
# Denied, not forbidden: the NVML loader (alkahest-sysinfo) and memory-mapped GGUF reads
# (alkahest-gguf) may `#[allow(unsafe_code)]` locally with a `// SAFETY:` comment.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Tests may use these: see clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# Exact third-party pins, chosen up front so parallel story branches do not fight over
# versions. Member crates opt in with `foo.workspace = true` and declare only what they use
# (keeps `cargo machete` clean). New pins: `=x.y.z`, licence checked with `cargo deny`.
[workspace.dependencies]
# Workspace crates
alkahest-api = { path = "crates/alkahest-api" }
alkahest-client = { path = "crates/alkahest-client" }
alkahest-core = { path = "crates/alkahest-core" }
alkahest-decision = { path = "crates/alkahest-decision" }
alkahest-desktop = { path = "crates/alkahest-desktop" }
alkahest-engine = { path = "crates/alkahest-engine" }
alkahest-fetch = { path = "crates/alkahest-fetch" }
alkahest-gguf = { path = "crates/alkahest-gguf" }
alkahest-hf = { path = "crates/alkahest-hf" }
alkahest-ollama = { path = "crates/alkahest-ollama" }
alkahest-pull = { path = "crates/alkahest-pull" }
alkahest-recipes = { path = "crates/alkahest-recipes" }
alkahest-sched = { path = "crates/alkahest-sched" }
alkahest-store = { path = "crates/alkahest-store" }
alkahest-sysinfo = { path = "crates/alkahest-sysinfo" }

# Async runtime and HTTP
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
futures = "=0.3.34"
async-stream = "=0.3.6"
bytes = "=1.12.1"
axum = { version = "=0.8.9", features = ["macros"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "=0.7.1", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "=1.12.0", features = ["full"] }
# rustls only, never native-tls / OpenSSL.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query"] }
url = { version = "=2.5.8", features = ["serde"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }

# Serialisation and configuration
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
serde_norway = "=0.9.42"
directories = "=6.0.0"

# Errors, CLI, logging
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env"] }
clap_complete = "=4.6.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-appender = "=0.2.5"
indicatif = "=0.18.6"

# Hashing, ids, time, text
sha2 = "=0.11.1"
hex = "=0.4.3"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
regex = "=1.13.1"
semver = { version = "=1.0.28", features = ["serde"] }
bytesize = "=2.7.0"

# Security
keyring = "=4.2.0"
rpassword = "=7.4.0"
argon2 = "=0.6.0"
rand = "=0.10.3"

# System, files, binary formats
sysinfo = "=0.39.6"
libloading = "=0.9.0"
# Process groups and signals for engine subprocesses (unix only; safe API, no local unsafe).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
memmap2 = "=0.9.11"
byteorder = "=1.5.0"
walkdir = "=2.5.0"
# Engine archives (pure Rust, no C): gzip, tar and zip.
flate2 = "=1.1.9"
tar = { version = "=0.4.45", default-features = false }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }

# Concurrency
parking_lot = "=0.12.5"
dashmap = "=6.1.0"

# Repository automation (xtask)
cargo_metadata = "=0.23.1"

# Tests
tempfile = "=3.27.0"
insta = { version = "=1.49.0", features = ["json", "yaml"] }
wiremock = "=0.6.5"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
proptest = "=1.12.0"
