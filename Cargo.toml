[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"
authors = ["Digio"]
# Placeholder until the public repository exists.
repository = "https://github.com/digiogithub/alchemai-alkahest"
rust-version = "1.98"
publish = false

# Release profile (ALK-US-0078). Fat LTO with one codegen unit and stripped symbols took the
# headless binary from 25.8 to 20.0 MiB (thin LTO: 21.3 MiB; opt-level "s" would reach 13.8 MiB
# but slows hashing and JSON paths, so it stays at 3). `panic = "abort"` is deliberately NOT
# set: the API server relies on tower-http's `CatchPanicLayer` to turn a handler panic into a
# 500 instead of killing every in-flight request and the engines it supervises.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Fast dev builds: line tables are enough for backtraces and keep link time and target/ small;
# dependencies get no debug info and a light optimisation, so tests and the desktop app run
# usably while workspace crates stay fully debuggable.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
opt-level = 1

[workspace.lints.rust]
# Denied, not forbidden: the NVML loader (alkahest-sysinfo) and memory-mapped GGUF reads
# (alkahest-gguf) may `#[allow(unsafe_code)]` locally with a `// SAFETY:` comment.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Tests may use these: see clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# Exact third-party pins, chosen up front so parallel story branches do not fight over
# versions. Member crates opt in with `foo.workspace = true` and declare only what they use
# (keeps `cargo machete` clean). New pins: `=x.y.z`, licence checked with `cargo deny`.
[workspace.dependencies]
# Workspace crates
alkahest-api = { path = "crates/alkahest-api" }
alkahest-catalog = { path = "crates/alkahest-catalog" }
alkahest-client = { path = "crates/alkahest-client" }
alkahest-core = { path = "crates/alkahest-core" }
alkahest-decision = { path = "crates/alkahest-decision" }
alkahest-desktop = { path = "crates/alkahest-desktop" }
alkahest-engine = { path = "crates/alkahest-engine" }
alkahest-fetch = { path = "crates/alkahest-fetch" }
alkahest-gguf = { path = "crates/alkahest-gguf" }
alkahest-hf = { path = "crates/alkahest-hf" }
alkahest-ollama = { path = "crates/alkahest-ollama" }
alkahest-pull = { path = "crates/alkahest-pull" }
alkahest-recipes = { path = "crates/alkahest-recipes" }
alkahest-sched = { path = "crates/alkahest-sched" }
alkahest-store = { path = "crates/alkahest-store" }
alkahest-sysinfo = { path = "crates/alkahest-sysinfo" }

# Async runtime and HTTP
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
futures = "=0.3.34"
async-stream = "=0.3.6"
bytes = "=1.12.1"
axum = { version = "=0.8.9", features = ["macros", "multipart"] }
tower = { version = "=0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "=0.7.1", features = ["trace", "cors", "limit", "timeout", "request-id", "sensitive-headers", "catch-panic"] }
hyper = { version = "=1.12.0", features = ["full"] }
# Body trait for response wrappers (request feed); already in the lock through axum and hyper.
http-body = "=1.1.0"
# Custom accept loop (TLS, connection tracking); already in the lock through axum and reqwest.
hyper-util = { version = "=0.1.21", features = ["server-auto", "server-graceful", "tokio", "service"] }
# HTTPS listener (ALK-SP-0006.R6); aws-lc-rs is the provider reqwest already uses.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# rustls only, never native-tls / OpenSSL.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "multipart"] }
url = { version = "=2.5.8", features = ["serde"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }

# Serialisation and configuration
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
# Comment-preserving edits of the user config file (admin network settings).
toml_edit = "=0.25.17"
serde_norway = "=0.9.42"
directories = "=6.0.0"

# Errors, CLI, logging
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env"] }
clap_complete = "=4.6.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-appender = "=0.2.5"
indicatif = "=0.18.6"

# Hashing, ids, time, text
sha2 = "=0.11.1"
hex = "=0.4.3"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
regex = "=1.13.1"
semver = { version = "=1.0.28", features = ["serde"] }
bytesize = "=2.7.0"

# Terminal line editing (`alkahest run`); file history only, no fuzzy search or dirs.
rustyline = { version = "=18.0.1", default-features = false, features = ["with-file-history"] }

# Security
keyring = "=4.2.0"
rpassword = "=7.5.4"
argon2 = "=0.6.0"
rand = "=0.10.3"
# Wipes secrets (TLS keys, API key secrets, HF token) from memory on drop.
zeroize = "=1.9.1"

# System, files, binary formats
sysinfo = "=0.39.6"
libloading = "=0.9.0"
# Process groups and signals for engine subprocesses (unix only; safe API, no local unsafe).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
memmap2 = "=0.9.11"
# Windows: job objects for engines, event log, service entry, key store ACLs. 0.61 is the
# line windows-service and tokio already use.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_EventLog", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows-service = "=0.8.1"
byteorder = "=1.5.0"
walkdir = "=2.5.0"
# File identity across hard links (Windows has no stable link count in std).
same-file = "=1.0.6"
# Engine archives (pure Rust, no C): gzip, tar and zip.
flate2 = "=1.1.9"
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
# Pure-Rust rpm writer for `cargo xtask bundle` (cargo-packager has no rpm target, ALK-US-0105).
# No PGP signing, zstd or xz: packages are gzip-compressed and unsigned (the release has SHA256SUMS).
rpm = { version = "=0.30.2", default-features = false, features = ["payload", "gzip-compression"] }

# Concurrency
parking_lot = "=0.12.5"
dashmap = "=6.1.0"

# Desktop app (only `alkahest-desktop` may depend on it; `cargo xtask check-deps`). Same pin as
# the reference apps Bitacora and Pando Assistant; it brings `gpui-pre` 0.3.8.
gpui-kit = "=0.7.1"
# Desktop system tray (ALK-US-0073), same crates as Pando Assistant: ksni (Unlicense,
# StatusNotifierItem over zbus, already locked by gpui) on Linux, tray-icon (MIT OR Apache-2.0)
# on macOS and Windows.
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"] }
tray-icon = "=0.21.3"

# Repository automation (xtask)
cargo_metadata = "=0.23.1"
# `cargo xtask icons`: SVG rasterizer (Apache-2.0 OR MIT), same version gpui-pre already locks.
resvg = { version = "=0.45.1", default-features = false }

# Tests
tempfile = "=3.27.0"
insta = { version = "=1.49.0", features = ["json", "yaml"] }
wiremock = "=0.6.5"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
proptest = "=1.12.0"
