name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: lint (fmt, clippy, deny, check-deps, typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (channel and components) comes from rust-toolchain.toml.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check-deps (crate graph rules)
        run: cargo xtask check-deps
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: crate-ci/typos@v1

  test:
    name: test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Headless build (no desktop feature)
        run: cargo build -p alkahest --no-default-features --locked
      - name: Tests (nextest ci profile, JUnit)
        run: cargo nextest run --workspace --locked --profile ci
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # Release build of the headless binary; fails above the size budget (default 60 MiB).
  size:
    name: binary size (release, headless)
    needs: lint
    runs-on: ubuntu-latest
    env:
      ALKAHEST_SIZE_BUDGET_MIB: "60"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and report size
        run: scripts/binary-size.sh

  # SDK conformance (ALK-US-0038): the official ollama and openai Python clients against
  # the API server over a fake llama-server (no model download).
  conformance:
    name: SDK conformance (ollama-python, openai-python)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance suite
        run: scripts/conformance.sh

  # Unused dependencies.
  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # The desktop build links GPUI (X11/Wayland/Vulkan). Skipped until ALK-US-0064 provides
  # the app; set the repository variable DESKTOP_CI to "true" to enable it.
  desktop:
    name: desktop build (feature desktop)
    if: ${{ vars.DESKTOP_CI == 'true' }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libfontconfig-dev
      - run: cargo build -p alkahest --features desktop --locked
