name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: lint (fmt, clippy, deny, check-deps, typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (channel and components) comes from rust-toolchain.toml.
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check-deps (crate graph rules)
        run: cargo xtask check-deps
      - name: design tokens (generated theme current, WCAG contrast)
        run: cargo xtask tokens --check --contrast
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: crate-ci/typos@v1

  test:
    name: test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Headless build (no desktop feature)
        run: cargo build -p alkahest --no-default-features --locked
      - name: Tests (nextest ci profile, JUnit)
        run: cargo nextest run --workspace --locked --profile ci
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # Release build of the headless binary; fails above the size budget (default 60 MiB).
  size:
    name: binary size (release, headless)
    needs: lint
    runs-on: ubuntu-latest
    env:
      ALKAHEST_SIZE_BUDGET_MIB: "60"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and report size
        run: scripts/binary-size.sh

  # SDK conformance (ALK-US-0038): the official ollama and openai Python clients against
  # the API server over a fake llama-server (no model download).
  conformance:
    name: SDK conformance (ollama-python, openai-python)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance suite
        run: scripts/conformance.sh

  # Unused dependencies.
  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # The desktop build links GPUI (X11/Wayland/Vulkan): tokens are current and pass WCAG
  # contrast, the app builds, its GUI unit tests run, and `alkahest desktop --smoke-test`
  # renders a first frame under Xvfb (software Vulkan through Mesa lavapipe). On by default
  # since ALK-US-0064; set the repository variable DESKTOP_CI to "false" to skip it.
  desktop:
    name: desktop (tokens, build, GUI tests, smoke test)
    if: ${{ vars.DESKTOP_CI != 'false' }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for GPUI, Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libasound2-dev libfontconfig-dev mesa-vulkan-drivers xvfb
      - name: Design tokens are current and pass the contrast check
        run: cargo xtask tokens --check --contrast
      - name: clippy (desktop feature)
        run: cargo clippy -p alkahest-desktop -p alkahest --features alkahest-desktop/gui-test,alkahest/desktop --all-targets --locked -- -D warnings
      - name: GUI unit tests
        run: cargo test -p alkahest-desktop --features gui-test --locked
      - name: Build
        run: cargo build -p alkahest --features desktop --locked
      - name: Smoke test (first frame under Xvfb)
        env:
          ALKAHEST_HOME: ${{ runner.temp }}/alkahest-home
        run: xvfb-run -a -s "-screen 0 1440x900x24" target/debug/alkahest desktop --smoke-test
