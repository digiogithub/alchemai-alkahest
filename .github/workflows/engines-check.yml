# Weekly report of engine releases newer than the pins in recipes/*.toml (ALK-US-0053).
# It opens no issue and no pull request: the result is the job summary (and the log).
# Network access happens only in this job.
name: Engine pin check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Compare pins with upstream releases
        env:
          # Raises the GitHub API rate limit; read-only.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask engines-check
