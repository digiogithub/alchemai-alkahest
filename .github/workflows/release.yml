# Tag-driven release (ALK-US-0074, 0075, 0076, 0105). Pushing `vX.Y.Z` (or `vX.Y.Z-rc.N`) builds:
#
#   Linux    headless tar.gz (x86_64, aarch64: `alkahest-<version>-<target>.tar.gz` with the
#            binary, the bundled CPU llama.cpp in engines/, systemd unit templates, licences; the
#            archive scripts/setup/install.sh downloads) and its rpm; on x86_64 also the desktop
#            .deb, .AppImage and rpm (cargo-packager, and `cargo xtask bundle` for the rpm).
#   macOS    aarch64 and x86_64: Alkahest.app in a signed, notarised and stapled .dmg, and the
#            headless tar.gz whose binaries (alkahest, the bundled llama.cpp) are signed and
#            notarised (submit-only: a bare Mach-O cannot carry a ticket).
#   Windows  x86_64: Authenticode-signed NSIS installer `alkahest_<version>_x64-setup.exe` and
#            the headless .zip that install.ps1 downloads, both with signed executables inside.
#   SHA256SUMS over every artefact, in the `<hash>  <file>` format install.sh checks, and the
#            Homebrew formula `alkahest.rb` rendered from it (a maintainer copies it to the tap).
#
# The final job creates a DRAFT release; a maintainer reviews and publishes it.
#
# Signing is mandatory: there is no unsigned fallback, so a run without the signing material
# fails instead of publishing unsigned macOS or Windows artefacts. It follows the Digio scheme
# shared with digiogithub/pando and digiogithub/bitacora:
#
#   macOS    one secret, MACOS_SIGNING_BUNDLE (base64 .tar.gz with both Developer ID .p12 files
#            and the `kvagerc` env file with their passwords and the notary credentials), unpacked
#            into an ephemeral keychain by digiogithub/ci-actions/macos-signing-keychain.
#            cargo-packager signs the .app and the .dmg with that identity (APPLE_ID stays unset,
#            so it does not notarise); macos-codesign signs the loose headless binaries and
#            macos-notarize notarises and staples.
#   Windows  no secret: Azure Artifact Signing over OIDC. The job runs in the `release`
#            environment, whose federated credential lets the shared Entra app in
#            vars.AZURE_CLIENT_ID sign; AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_CERT_PROFILE are
#            repository variables. Executables are signed before they are packaged, then the
#            installer; Get-AuthenticodeSignature fails the job unless every file is Valid.
#
# Only artefacts named `dist-*` reach the release job, and they are only uploaded after the
# signature checks, so an unsigned binary cannot be published.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build into a draft release."
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: validate tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: check
        name: Tag must equal the workspace version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "alkahest") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  linux:
    name: linux (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, desktop: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, desktop: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Licences are current
        run: cargo xtask notice --check

      - name: Size and startup budgets (headless)
        run: scripts/binary-size.sh

      # The headless binary must not link GPU or windowing libraries.
      - name: Headless binary links no GUI libraries
        run: |
          ldd target/release/alkahest | tee ldd.txt
          if grep -Ei 'libX11|libxcb|libxkbcommon|libwayland|libvulkan|libfontconfig|libGL|libasound' ldd.txt; then
            echo "::error::the headless binary links GUI/GPU libraries"; exit 1
          fi

      - name: Desktop build dependencies
        if: matrix.desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev \
            libfontconfig-dev libfuse2t64 file
      - uses: taiki-e/install-action@v2
        if: matrix.desktop
        with:
          tool: cargo-packager@0.11.8

      - name: Bundle (headless tar.gz + rpm; on x86_64 also .deb, .AppImage and the desktop rpm)
        run: |
          if [ "${{ matrix.desktop }}" = "true" ]; then
            cargo xtask bundle --formats deb,appimage,rpm
          else
            cargo xtask bundle --flavour headless --formats rpm
          fi
          ls -la target/packager

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.target }}
          path: |
            target/packager/*.tar.gz
            target/packager/*.deb
            target/packager/*.rpm
            target/packager/*.AppImage
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.target }}, signed + notarised)
    needs: meta
    runs-on: ${{ matrix.os }}
    # Notarisation submits the dmg and the headless binaries with --wait.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Signing material is configured
        env:
          HAS_BUNDLE: ${{ secrets.MACOS_SIGNING_BUNDLE != '' }}
        run: |
          if [ "$HAS_BUNDLE" != "true" ]; then
            echo "::error::secret MACOS_SIGNING_BUNDLE is not set: releases are never built unsigned"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # Exports SIGNING_IDENTITY, NOTARY_PROFILE and MACOS_SIGN_KEYCHAIN_PATH/PASSWORD for the
      # steps below; the keychain joins the user search list, so codesign and cargo-packager
      # find the identity there.
      - name: Set up the signing keychain
        uses: digiogithub/ci-actions/macos-signing-keychain@v1
        with:
          signing-bundle: ${{ secrets.MACOS_SIGNING_BUNDLE }}
          env-file: kvagerc
          keychain-name: alkahest-build
          notary-profile: alkahest-notary

      # The headless pass builds the headless binary (target/bundle/alkahest-headless) and stages
      # the bundled engine (target/bundle/engines); its tar.gz holds unsigned binaries and is
      # dropped. The desktop binary is built here too, so the bundle step below only packages.
      - name: Build (headless binary, bundled engine, desktop binary)
        run: |
          set -euo pipefail
          cargo xtask bundle --flavour headless
          cargo build --release --locked -p alkahest --features desktop
          rm -f target/packager/*.tar.gz

      - id: loose
        name: List the loose Mach-O files
        run: |
          set -euo pipefail
          {
            echo 'paths<<EOF_PATHS'
            find target/bundle/alkahest-headless target/bundle/engines -type f | sort | while IFS= read -r f; do
              if file -b "$f" | grep -q 'Mach-O'; then echo "$f"; fi
            done
            echo 'EOF_PATHS'
          } >> "$GITHUB_OUTPUT"

      # Signed in place before archiving: the tar.gz and the .app both copy these files.
      - name: Codesign the headless binary and the bundled engine
        uses: digiogithub/ci-actions/macos-codesign@v1
        with:
          paths: ${{ steps.loose.outputs.paths }}
          entitlements: packaging/macos/entitlements.plist

      # Headless tar.gz (from the signed files), then Alkahest.app and the dmg. cargo-packager
      # signs every Mach-O file in the bundle with the hardened runtime and
      # packaging/macos/entitlements.plist, and signs the dmg. APPLE_ID and the API key stay
      # unset, so it does not notarise: the dmg is notarised and stapled below.
      # hdiutil on hosted runners intermittently fails to eject the scratch image ("Resource
      # busy") while Spotlight or XProtect scan it: turn indexing off and retry once (the
      # second attempt reuses the built binaries, so it only repeats the packaging).
      - name: Bundle and sign (tar.gz, .app, .dmg)
        run: |
          set -euo pipefail
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          sudo mdutil -a -i off || true
          if ! cargo xtask bundle --no-build; then
            echo "::warning::bundling failed, retrying once (hdiutil eject is flaky on hosted runners)"
            hdiutil info | grep -E '^/dev/disk[0-9]+' | awk '{print $1}' | sort -u | while read -r d; do
              hdiutil detach -force "$d" || true
            done
            # The failed attempt leaves a half-built Alkahest.app that cargo-packager would
            # reuse without its resources; start packaging from scratch (the signed binaries and
            # engines stay staged in target/bundle).
            rm -rf target/packager
            sleep 10
            cargo xtask bundle --no-build
          fi
          ls -la target/packager

      - name: Smoke test the bundle
        run: |
          set -euo pipefail
          app="target/packager/Alkahest.app"
          test -x "$app/Contents/MacOS/alkahest"
          "$app/Contents/MacOS/alkahest" --version
          ls "$app/Contents/Resources/engines/llama-cpp"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -qx es.digio.alkahest

      - name: Verify the signatures
        run: |
          set -euo pipefail
          app="target/packager/Alkahest.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | tee sig.txt
          grep -q 'flags=.*runtime' sig.txt || { echo "::error::hardened runtime missing"; exit 1; }
          codesign --verify --verbose=2 target/packager/*.dmg
          # The headless archive is built from this staged tree.
          stage="target/bundle/alkahest-${VERSION}-${{ matrix.target }}"
          find "$stage" -type f | while IFS= read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$f" || { echo "::error::unsigned: $f"; exit 1; }
            fi
          done

      # notarytool takes an archive: the staged headless tree goes in as a zip (submit-only).
      - name: Archive the headless tree for notarisation
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "target/bundle/alkahest-${VERSION}-${{ matrix.target }}" \
            "$RUNNER_TEMP/alkahest-headless-${{ matrix.target }}.zip"

      # The dmg ticket is stapled; the headless binaries pass Gatekeeper's online check.
      - name: Notarise
        uses: digiogithub/ci-actions/macos-notarize@v1
        with:
          paths: |
            target/packager/*.dmg
            ${{ runner.temp }}/alkahest-headless-${{ matrix.target }}.zip
          staple: auto

      - name: Verify the staple and Gatekeeper
        run: |
          set -euo pipefail
          xcrun stapler validate target/packager/*.dmg
          spctl --assess --type execute --verbose=2 target/packager/Alkahest.app

      - name: Clean up the signing keychain
        if: always()
        uses: digiogithub/ci-actions/macos-keychain-cleanup@v1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.target }}
          path: |
            target/packager/*.tar.gz
            target/packager/*.dmg
          if-no-files-found: error

  windows:
    name: windows (x86_64-pc-windows-msvc, Authenticode)
    needs: meta
    runs-on: windows-latest
    # The federated credential on the shared Entra app is scoped to
    # repo:digiogithub/alchemai-alkahest:environment:release: the OIDC token only validates
    # from a job in that environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      # The headless pass builds target/bundle/alkahest-headless.exe and stages the bundled
      # engine in target/bundle/engines; its zip holds unsigned executables and is dropped. The
      # desktop build writes target/release/alkahest.exe, which the installer packages.
      - name: Build (headless binary, bundled engine, desktop binary)
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask bundle --flavour headless
          cargo build --release --locked -p alkahest --features desktop
          rm -f target/packager/*.zip

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # No credential inputs: the action falls back to the Azure CLI session above, which is the
      # federated GitHub identity. Signed before packaging: both alkahest.exe builds and the
      # bundled llama.cpp executables and DLLs (Smart App Control blocks unsigned code).
      - name: Sign the executables
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\alkahest.exe
            ${{ github.workspace }}\target\bundle\alkahest-headless.exe
          files-folder: ${{ github.workspace }}\target\bundle\engines
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # --no-build keeps the signed binaries: the zip is staged from target/bundle and the
      # installer packages target/release/alkahest.exe and target/bundle/engines.
      - name: Bundle (zip, NSIS installer)
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask bundle --no-build
          ls -la target/packager

      - name: Sign the installer
        uses: azure/trusted-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\target\packager
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Every shipped executable: the loose binaries, the installer, and what the zip contains.
      - name: Verify the signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem target/packager/*.zip).FullName
          $unzipped = Join-Path $env:RUNNER_TEMP 'alkahest-zip'
          Expand-Archive -Path $zip -DestinationPath $unzipped -Force
          $files = @(Get-Item target/release/alkahest.exe, target/bundle/alkahest-headless.exe) +
            @(Get-ChildItem target/packager/*-setup.exe) +
            @(Get-ChildItem target/bundle/engines -Recurse -Include *.exe, *.dll) +
            @(Get-ChildItem $unzipped -Recurse -Include *.exe, *.dll)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "-- $($f.FullName): $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::Unsigned or invalid: $($f.FullName) ($($sig.Status))"
              $bad = 1
            }
          }
          exit $bad

      # Install silently into a scratch directory with the components the runner can exercise
      # (PATH and the service; the CUDA download is skipped), look at the result, then uninstall
      # and check nothing is left behind: the service, the PATH entry and the files.
      - name: Install, check and uninstall silently
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem target/packager/*-setup.exe).FullName
          $dir = 'C:\AlkahestSmoke'
          $p = Start-Process -FilePath $installer -ArgumentList '/S', '/SERVICE', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          & "$dir\alkahest.exe" --version
          if (-not (Test-Path "$dir\engines\llama-cpp")) { throw 'bundled engine missing' }
          if (-not (Test-Path "$dir\alkahest.ico")) { throw 'icon missing' }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike "*$dir*") { throw 'PATH entry missing' }
          # The service is delayed-auto and its start is asynchronous: wait for it, and on
          # failure dump what the service manager and the service itself logged.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Service alkahest -ErrorAction Stop).Status -ne 'Running' -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if ((Get-Service alkahest).Status -ne 'Running') {
            & sc.exe query alkahest
            & sc.exe qc alkahest
            & sc.exe qfailure alkahest
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Alkahest' } -MaxEvents 30 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, LevelDisplayName, Message
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 15 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'lkahest' } | Format-List TimeCreated, Id, Message
            Get-ChildItem C:\ProgramData\Alkahest -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            & "$dir\alkahest.exe" service status
            throw 'service is not running'
          }
          $p = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Get-Service alkahest -ErrorAction SilentlyContinue) { throw 'service survived the uninstall' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -like "*$dir*") { throw 'PATH entry survived' }
          if (Test-Path "$dir\alkahest.exe") { throw 'files survived the uninstall' }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: |
            target/packager/*.zip
            target/packager/*-setup.exe
          if-no-files-found: error

  release:
    name: draft release
    needs: [meta, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Rendered after SHA256SUMS on purpose: the formula is not an artefact install.sh verifies.
      - name: Homebrew formula
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: scripts/release/homebrew-formula.sh "$VERSION" dist/SHA256SUMS > dist/alkahest.rb
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--draft --title "Alkahest ${TAG#v}" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}" --repo "$GITHUB_REPOSITORY"
