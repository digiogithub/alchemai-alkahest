# Model entry (ALK-SP-0011.R7): PrismML Ternary Bonsai 2 4B, a vision-language model with ternary
# weights derived from Qwen3.5-4B (hybrid attention, 262K context).
# Pulled as `alkahest/prism-ml/ternary-bonsai-2-4b[:tag]` (first variant = default tag).
# Files come from the Hugging Face repository prism-ml/Ternary-Bonsai-2-4B-gguf (Apache-2.0) pinned at commit
# 8d6557168168f91ea6697a4a49ed2ef622b53adb; sha256 and size are the LFS values reported by the Hugging Face API.
# PQ2_0 and PTQ1_0 need the PrismML llama.cpp fork (engine `prism-llama-cpp`); Q2_0 also runs on
# recent mainline llama.cpp, but the fork is pinned here because it is the tested runtime.
# Every variant carries the Q8_0 vision projector (the model card advises against the BF16 one
# under concurrent image requests). Parameters are the model card's thinking-mode defaults; for
# short answers turn thinking off per request (`chat_template_kwargs: {enable_thinking: false}`).
# The chat template is the one embedded in the GGUF.
name = "prism-ml/ternary-bonsai-2-4b"
description = "Ternary Bonsai 2 4B (PrismML): vision-language model with ternary weights from Qwen3.5-4B, 262K context."
license = "apache-2.0"
homepage = "https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf"
tags = ["chat", "vision", "thinking", "ternary", "bonsai", "small"]

[[variants]]
tag = "pq2_0"
format = "gguf"
quant = "PQ2_0"
engine = "prism-llama-cpp"
params = { num_ctx = 32768, temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 1.0, repeat_penalty = 1.0 }
