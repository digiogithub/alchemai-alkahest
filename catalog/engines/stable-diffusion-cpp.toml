# Engine recipe: stable-diffusion.cpp `sd-server` (ALK-SP-0003.R2/R4; ALK-SP-0005.R4; ALK-US-0059).
#
# Pinned to the upstream release master-970-2f016e8 (commit 2f016e8 of github.com/leejet/stable-diffusion.cpp).
# Every sha256 is the digest GitHub reports for the release asset (`digest` field of the releases
# API). The archives are flat (no wrapper directory) and hold `sd-server`, `sd-cli` and their
# shared libraries; on Linux and macOS the binaries carry RUNPATH $ORIGIN / @loader_path, so no
# `library_dirs` is needed. `sd-server --help` of this build is the reference for the adapter:
# `-m`, `-l/--listen-ip`, `--listen-port`, `-t`, `--backend`, `-s`, and the OpenAI-compatible
# `POST /v1/images/generations`.
#
# Variants:
#   cpu       Linux x64 (built on Ubuntu 24.04: needs glibc 2.39+), macOS arm64 (Metal is compiled in
#             and used automatically), Windows x64. Runtime-selected SIMD backends.
#   metal     macOS Apple Silicon: the same archive as `cpu`.
#   vulkan    Linux x64 and Windows x64, any Vulkan 1.x GPU through the system loader.
#   rocm      AMD ROCm/HIP 10.1 (Linux x64, Windows x64); needs the ROCm runtime on the host.
#   cuda12.4  Windows x64 prebuilt (needs the CUDA 12 runtime DLLs: the separate
#             `cudart-sd-bin-win-cu12-x64.zip` of the release, 563 MB, or a CUDA toolkit on PATH),
#             and a Linux source build (needs nvcc 12.4+ on PATH; the release has no Linux CUDA
#             binary).
#
# Every variant also carries `source` build steps (`engines install --from-source`); the
# repository vendors ggml, libwebp and libwebm as submodules.

id = "stable-diffusion-cpp"
version = "master-970-2f016e8"
description = "stable-diffusion.cpp (image generation server)"
license = "MIT"
homepage = "https://github.com/leejet/stable-diffusion.cpp"
executable = "sd-server"


[variants."cpu"]
accelerator = "cpu"
[[variants."cpu".assets]]
os = "linux"
arch = "x86_64"
