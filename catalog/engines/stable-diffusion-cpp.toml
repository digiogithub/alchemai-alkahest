[variants."cpu".source]
git = "https://github.com/leejet/stable-diffusion.cpp.git"
rev = "master-970-2f016e8"
submodules = true
cmake_flags = ["-DSD_BUILD_SHARED_LIBS=ON", "-DSD_BUILD_SHARED_GGML_LIB=ON", "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON", "-DCMAKE_INSTALL_RPATH=$ORIGIN", "-DGGML_NATIVE=OFF", "-DGGML_CPU_ALL_VARIANTS=ON", "-DGGML_BACKEND_DL=ON"]
targets = ["sd-server"]
tools = ["git", "cmake", "ninja"]


