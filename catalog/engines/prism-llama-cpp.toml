# Engine recipe: PrismML llama.cpp fork for Bonsai ternary models (PQ2_0, PTQ1_0)
# (ALK-SP-0003.R2/R4, ALK-US-0051).
#
# Pinned to the fork release prism-b10777-e3de715 (commit e3de715222b2667c54a267441159a5729f11155e of
# github.com/PrismML-Eng/llama.cpp, the `prism` branch). Every sha256 is the digest GitHub reports
# for the release asset. Asset names follow /www/Pips/llm/Bonsai-demo/scripts/download_binaries.sh.
#
# Engine selection ([[ALK-SP-0003]] R2) sends PQ2_0/PTQ1_0 GGUF files here; mainline llama.cpp
# cannot read them. The archives are laid out like mainline ones: one wrapper directory
# (stripped), `llama-server` next to its `libggml-*.so` / `libllama*.so`, with RUNPATH=$ORIGIN on
# Linux, so no `library_dirs` is needed.
#
# Variants (CUDA builds need the CUDA runtime libraries installed on the host; the upstream
# cudart-* archives are 150-390 MB and are not installed by this recipe):
#   cpu, cuda12.4 / cuda12.8 / cuda13.3, vulkan, rocm (Linux ROCm 7.2, Windows HIP Radeon),
#   metal (macOS arm64), sycl (never picked automatically).

id = "prism-llama-cpp"
version = "prism-b10777-e3de715"
description = "llama.cpp, PrismML fork (Bonsai ternary PQ2_0 / PTQ1_0 models)"
license = "MIT"
homepage = "https://github.com/PrismML-Eng/llama.cpp"
executable = "llama-server"


