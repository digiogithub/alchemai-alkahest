[files]
extend-exclude = [
    "Cargo.lock",
    "LICENSE",
    # Generated from third-party sources (cargo xtask notice) and their verbatim licence texts.
    "THIRD_PARTY_LICENSES",
    "packaging/licenses/**",
    "docs/.pmngr/**",
    # Product owner notes and the design hand-off are partly Spanish.
    "initial_requirements.md",
    "design/**",
]

[default.extend-words]
alkahest = "alkahest"
Alkahest = "Alkahest"
gguf = "gguf"
GGUF = "GGUF"
gpui = "gpui"
# "PNGs" is split into "PN" + "Gs"
PN = "PN"
# flate2 crate name
flate = "flate"
# Ollama's `/set nothink` REPL command, kept for muscle memory.
nothink = "nothink"
