[package]
name = "alkahest"
description = "Alkahest: local and on-premise AI model server and manager (CLI, server and desktop launcher)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "alkahest"
path = "src/main.rs"

[features]
default = []
# Links the GPUI desktop app for `alkahest desktop`. A build without it must not
# link GPUI, X11, Wayland or Vulkan.
desktop = ["dep:alkahest-desktop", "alkahest-desktop/gui"]

[dependencies]
alkahest-api.workspace = true
alkahest-catalog.workspace = true
alkahest-client.workspace = true
alkahest-core.workspace = true
alkahest-fetch.workspace = true
alkahest-desktop = { workspace = true, optional = true }
alkahest-engine.workspace = true
alkahest-hf.workspace = true
alkahest-ollama.workspace = true
alkahest-pull.workspace = true
alkahest-recipes.workspace = true
alkahest-sched.workspace = true
alkahest-store.workspace = true
alkahest-sysinfo.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
futures.workspace = true
indicatif.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rustyline.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
time.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys.workspace = true

[dev-dependencies]
alkahest-gguf.workspace = true
assert_cmd.workspace = true
flate2.workspace = true
hex.workspace = true
predicates.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
wiremock.workspace = true
zip.workspace = true

# `alkahest-desktop` is only referenced through the optional `desktop` feature.
[package.metadata.cargo-machete]
ignored = ["alkahest-desktop"]

# Linux packages (ALK-US-0074): `cargo xtask bundle` builds the flavours and runs cargo-packager
# for the desktop `.deb` and `.AppImage`. Paths are relative to this manifest. `engines/` is
# staged by `cargo xtask bundle` (the bundled CPU llama.cpp, ALK-SP-0003.R6) and is found at run
# time through `alkahest_recipes::bundled_roots` (`<exe dir>/../lib/alkahest/engines`).
[package.metadata.packager]
product-name = "alkahest"
identifier = "es.digio.alkahest"
description = "Local and on-premise AI model server and manager."
long-description = "Alkahest runs language, vision, speech and image models on your own machine: an Ollama-style CLI, on-demand loading, several engines and one API (Ollama, OpenAI, Anthropic). This package contains the desktop app, the CLI, the server and a CPU llama.cpp engine."
homepage = "https://github.com/digiogithub/alchemai-alkahest"
authors = ["Digio <jose@digio.es>"]
publisher = "Digio"
copyright = "Copyright (c) Digio. MIT licensed."
license-file = "../../LICENSE"
category = "Utility"
out-dir = "../../target/packager"
binaries-dir = "../../target/release"
binaries = [{ path = "alkahest", main = true }]
icons = [
    "../../packaging/icons/alkahest-32.png",
    "../../packaging/icons/alkahest-128.png",
    "../../packaging/icons/alkahest-256.png",
    "../../packaging/icons/alkahest-512.png",
]
resources = [
    { src = "../../target/bundle/engines", target = "engines" },
    { src = "../../packaging/licenses", target = "licenses" },
    { src = "../../packaging/systemd/alkahest.service", target = "systemd/alkahest.service" },
    { src = "../../packaging/systemd/alkahest.user.service", target = "systemd/alkahest.user.service" },
    { src = "../../NOTICE", target = "NOTICE" },
    { src = "../../THIRD_PARTY_LICENSES", target = "THIRD_PARTY_LICENSES" },
]

[package.metadata.packager.deb]
section = "utils"
desktop-template = "../../packaging/linux/alkahest.desktop"
# GPUI renders through Vulkan: the loader and an ICD are required at runtime.
depends = [
    "libvulkan1",
    "mesa-vulkan-drivers | libvulkan-driver",
    "libxkbcommon-x11-0",
    "libxkbcommon0",
    "libfontconfig1",
    "libwayland-client0",
    "libasound2t64 | libasound2",
]

# macOS (ALK-US-0075): `cargo xtask bundle` on a macOS host builds `Alkahest.app` and the dmg.
# The icon set, product name and signing identity are set by xtask (`platform_config`); signing
# reads APPLE_SIGNING_IDENTITY from the environment and is skipped without it. The release
# workflow puts the identity in an ephemeral keychain and notarises outside the packager. Engines land in Contents/Resources/engines
# (`alkahest_recipes::bundled_roots`). `background-app` stays false: the app keeps its Dock icon
# next to the menu bar tray icon, so a closed window can be reopened from either (LSUIElement
# would hide the Dock icon and the application menu).
[package.metadata.packager.macos]
minimum-system-version = "12.0"
entitlements = "../../packaging/macos/entitlements.plist"
info-plist-path = "../../packaging/macos/Info.plist"
background-app = false

[package.metadata.packager.dmg]
window-size = { width = 640, height = 400 }
app-position = { x = 180, y = 190 }
app-folder-position = { x = 460, y = 190 }

# Windows (ALK-US-0076): NSIS installer for all users (Program Files, HKLM). The template is a
# modified copy of cargo-packager's own (components page, PATH, service, shortcuts that run
# `alkahest desktop`); see packaging/windows/installer.nsi.
[package.metadata.packager.nsis]
install-mode = "perMachine"
template = "../../packaging/windows/installer.nsi"
languages = ["English"]
compression = "lzma"
