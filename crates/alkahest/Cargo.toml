[package]
name = "alkahest"
description = "Alkahest: local and on-premise AI model server and manager (CLI, server and desktop launcher)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "alkahest"
path = "src/main.rs"

[features]
default = []
# Links the GPUI desktop app for `alkahest desktop`. A build without it must not
# link GPUI, X11, Wayland or Vulkan.
desktop = ["dep:alkahest-desktop"]

[dependencies]
alkahest-core.workspace = true
alkahest-desktop = { workspace = true, optional = true }
alkahest-sysinfo.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

# `alkahest-desktop` is only referenced through the optional `desktop` feature.
[package.metadata.cargo-machete]
ignored = ["alkahest-desktop"]
