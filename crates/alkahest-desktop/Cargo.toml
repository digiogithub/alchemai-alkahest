[package]
name = "alkahest-desktop"
description = "Alkahest: GPUI desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# The GPUI window. Off by default so `cargo build --workspace` (and every server-side story)
# does not compile GPUI; `alkahest --features desktop` turns it on. Without it the crate only
# holds the GPUI-free logic (connection state machine, server launcher, settings, tokens).
gui = ["dep:gpui-kit", "dep:resvg", "dep:ksni", "dep:tray-icon"]
# GPUI headless test contexts for the GUI unit tests (desktop CI job only).
gui-test = ["gui", "gpui-kit/test-support"]

[dependencies]
alkahest-client.workspace = true
# `ModelKind` (badge label, glyph, `kind.*` token key); GPUI-free and dependency-light.
alkahest-gguf.workspace = true
futures.workspace = true
gpui-kit = { workspace = true, optional = true }
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

# The tray icon is `design/brand/mark-tray.svg` rasterised at run time.
resvg = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Paused clock for the connection manager tests.
tokio = { workspace = true, features = ["test-util"] }
